name: Build Linux ARM64 binary

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build on Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          enable-stack: true
          stack-version: latest

      - name: Build gitstatus
        run: stack --local-bin-path dist install git-prompt:exe:gitstatus

      - name: Package and verify ARM64 binary
        run: |
          readelf -h dist/gitstatus | grep -Eq 'Machine: +AArch64'
          mkdir -p release
          tar -C dist -czf release/gitstatus-linux-aarch64.tar.gz gitstatus
          sha256sum release/gitstatus-linux-aarch64.tar.gz > release/gitstatus-linux-aarch64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitstatus-linux-aarch64
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Attach binary to GitHub Release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitstatus-linux-aarch64
          path: release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
